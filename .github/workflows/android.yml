name: AIZEN TV Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platform-tools"

      - name: Compilar APK
        run: ./gradlew :android:app:assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AIZEN-TV-debug
          path: android/app/build/outputs/apk/debug/*.apk
