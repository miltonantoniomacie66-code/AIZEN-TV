name: AIZEN TV Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Compilar APK
        shell: bash
        run: |
          set +e
          ./gradlew :android:app:assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            {
              echo "AIZEN TV - Diagnóstico da compilação"
              echo "Commit: $GITHUB_SHA"
              echo "Execução: $GITHUB_RUN_ID"
              echo
              echo "===== ERROS KOTLIN ====="
              grep -nE '(^e: |\\.kt:[0-9]+:[0-9]+|error:)' gradle-build.log | tail -n 80 || true
              echo
              echo "===== FINAL DO LOG ====="
              tail -n 35 gradle-build.log
            } > build-diagnostics.txt
          fi

          exit "$RESULT"

      - name: Publicar diagnóstico
        if: failure() && hashFiles('build-diagnostics.txt') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('build-diagnostics.txt', 'utf8');
            const { owner, repo } = context.repo;

            const blob = await github.rest.git.createBlob({
              owner, repo, content, encoding: 'utf-8'
            });

            let parents = [];
            let base_tree;

            try {
              const ref = await github.rest.git.getRef({
                owner, repo, ref: 'heads/build-diagnostics'
              });
              parents = [ref.data.object.sha];

              const commit = await github.rest.git.getCommit({
                owner, repo, commit_sha: parents[0]
              });
              base_tree = commit.data.tree.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const tree = await github.rest.git.createTree({
              owner, repo, base_tree,
              tree: [{
                path: 'latest-build-error.txt',
                mode: '100644',
                type: 'blob',
                sha: blob.data.sha
              }]
            });

            const newCommit = await github.rest.git.createCommit({
              owner, repo,
              message: 'Atualiza diagnóstico da compilação',
              tree: tree.data.sha,
              parents
            });

            if (parents.length) {
              await github.rest.git.updateRef({
                owner, repo, ref: 'heads/build-diagnostics',
                sha: newCommit.data.sha, force: true
              });
            } else {
              await github.rest.git.createRef({
                owner, repo,
                ref: 'refs/heads/build-diagnostics',
                sha: newCommit.data.sha
              });
            }

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIZEN-TV-debug
          path: android/app/build/outputs/apk/debug/*.apk
